[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mike-assistant"
version = "0.1.0"
description = "Soukromý lokální český hlasový asistent pro macOS Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Martin Švanda"}]
keywords = ["voice-assistant", "whisper", "ollama", "macos", "czech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Natural Language :: Czech",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
voice = [
  "numpy>=1.26,<3",
  "PyAudio>=0.2.14,<1",
  "resemblyzer>=0.1.4,<1",
]
mlx = ["mlx-whisper>=0.4.2,<1"]
torch = ["openai-whisper>=20250625"]
overlay = ["pyobjc-framework-Cocoa>=10,<14"]
dev = [
  "httpx>=0.27,<1",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.urls]
Homepage = "https://github.com/EmperorKunDis/M.I.K.E"
Documentation = "https://github.com/EmperorKunDis/M.I.K.E/tree/main/docs"
Issues = "https://github.com/EmperorKunDis/M.I.K.E/issues"
Source = "https://github.com/EmperorKunDis/M.I.K.E"

[project.scripts]
mike = "mike.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mike"]

[tool.coverage.report]
show_missing = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "S", "UP"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"src/mike/dashboard.py" = ["E501"]
"tests/*" = ["S101", "S104", "S108"]
